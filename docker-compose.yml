services:
  calculatorpro-web:
    build: .
    ports:
      - "127.0.0.1:18090:8000"
    env_file:
      - .env
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
