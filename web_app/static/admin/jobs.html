<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>任务 · 运维后台</title>
  <link rel="stylesheet" href="static/admin.css">
</head>
<body data-page="jobs">
  <div class="shell">
    <aside>
      <p class="kicker">CalculatorPro</p>
      <strong>运维后台</strong>
      <nav>
        <a href="./">概览</a>
        <a href="users">用户</a>
        <a href="jobs" aria-current="page">任务</a>
      </nav>
      <button type="button" id="logout" class="ghost">退出</button>
    </aside>
    <main>
      <div class="page-head">
        <h1>任务</h1>
        <button type="button" id="refresh" class="ghost">刷新</button>
      </div>
      <p class="note">当前进程里的报告任务来自内存。成功和失败会写入数据库，进程重启后仍可查看。这里不能重新触发报告。</p>
      <p id="error" class="banner" hidden></p>
      <div id="jobs"></div>
    </main>
  </div>
  <script src="static/admin.js"></script>
</body>
</html>
