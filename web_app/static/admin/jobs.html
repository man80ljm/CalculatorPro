<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>任务 · 运维后台</title>
  <link rel="stylesheet" href="static/admin.css">
</head>
<body data-page="jobs">
  <div class="shell">
    <aside>
      <p class="kicker">CalculatorPro</p>
      <strong>运维后台</strong>
      <nav>
        <a href="./">概览</a>
        <a href="users">用户</a>
        <a href="jobs" aria-current="page">任务</a>
        <a href="schedule">课表管理</a>
        <a href="invites">邀请码</a>
        <a href="settings">设置</a>
      </nav>
      <button type="button" id="logout" class="ghost">退出</button>
    </aside>
    <main>
      <div class="page-head">
        <h1>任务</h1>
        <button type="button" id="refresh" class="ghost">刷新</button>
      </div>
      <p class="note">选择用户查看对应的历史记录，每页 10 条，按时间倒序展示。这里不能重新触发报告。</p>
      <p id="error" class="banner" hidden></p>
      <section id="jobs">
        <h2 class="section-title">当前进程</h2>
        <div id="jobs-live"></div>
        <div class="history-head">
          <h2 class="section-title">历史记录</h2>
          <label class="history-filter" for="job-user">选择用户
            <select id="job-user"><option value="">全部用户</option></select>
          </label>
        </div>
        <div id="jobs-history" aria-busy="false"></div>
        <div class="history-pagination">
          <p id="jobs-summary" role="status" aria-live="polite"></p>
          <div class="actions">
            <button type="button" id="jobs-prev" class="ghost" disabled>上一页</button>
            <button type="button" id="jobs-next" class="ghost" disabled>下一页</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="static/admin.js"></script>
</body>
</html>
