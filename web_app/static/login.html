<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · CalculatorPro</title>
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c2430;
      --muted: #5e6872;
      --card: #fffdf8;
      --line: #e4dccf;
      --accent: #0f6e56;
      --danger: #8d2f2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(900px 420px at 10% -10%, #efe6d4 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    main {
      width: min(440px, calc(100% - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 32px 28px 28px;
      box-shadow: 0 18px 50px rgba(48, 36, 16, 0.08);
    }
    p.kicker {
      margin: 0 0 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--accent);
    }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 650; }
    .lead { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    label { display: block; font-size: 14px; margin: 12px 0 8px; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      color: inherit;
    }
    input:focus { outline: 2px solid rgba(15, 110, 86, 0.25); border-color: var(--accent); }
    button {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 650;
      padding: 12px 16px;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--accent);
      margin-top: 8px;
    }
    button:disabled { opacity: 0.6; cursor: progress; }
    .error { min-height: 1.4em; margin: 12px 0 0; color: var(--danger); font-size: 14px; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">CalculatorPro</p>
    <h1>课程目标达成度</h1>
    <p class="lead">使用教师账号登录。课程文件夹保存在服务器上，换一台电脑也能继续。</p>
    <form id="loginForm">
      <label for="loginUser">用户名或邮箱</label>
      <input id="loginUser" name="username" type="text" autocomplete="username" required>
      <label for="loginPassword">密码</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
      <button class="ghost" id="showRegister" type="button">注册账号</button>
      <p class="error" id="loginError" role="alert"></p>
    </form>
    <form id="registerForm" hidden>
      <label for="registerUser">用户名或邮箱</label>
      <input id="registerUser" name="username" type="text" autocomplete="username" required>
      <label for="registerPassword">密码</label>
      <input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <p class="hint">密码至少 8 位。注册后即可登录，不需要邀请码。</p>
      <button type="submit">注册</button>
      <button class="ghost" id="showLogin" type="button">返回登录</button>
      <p class="error" id="registerError" role="alert"></p>
    </form>
  </main>
  <script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    document.getElementById("showRegister").addEventListener("click", () => {
      loginForm.hidden = true;
      registerForm.hidden = false;
    });
    document.getElementById("showLogin").addEventListener("click", () => {
      registerForm.hidden = true;
      loginForm.hidden = false;
    });
    if (location.hash === "#register") {
      loginForm.hidden = true;
      registerForm.hidden = false;
    }

    async function submitAuth(url, username, password, errorNode) {
      errorNode.textContent = "";
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        errorNode.textContent = typeof data.detail === "string" ? data.detail : "请求失败";
        return false;
      }
      return true;
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = loginForm.querySelector("button[type=submit]");
      button.disabled = true;
      try {
        const ok = await submitAuth(
          "/api/login",
          document.getElementById("loginUser").value,
          document.getElementById("loginPassword").value,
          document.getElementById("loginError")
        );
        if (ok) location.href = "/";
      } catch (err) {
        document.getElementById("loginError").textContent = "无法连接服务器";
      } finally {
        button.disabled = false;
      }
    });

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = registerForm.querySelector("button[type=submit]");
      button.disabled = true;
      const username = document.getElementById("registerUser").value;
      const password = document.getElementById("registerPassword").value;
      try {
        const created = await submitAuth("/api/register", username, password, document.getElementById("registerError"));
        if (!created) return;
        const ok = await submitAuth("/api/login", username, password, document.getElementById("registerError"));
        if (ok) location.href = "/";
      } catch (err) {
        document.getElementById("registerError").textContent = "无法连接服务器";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
